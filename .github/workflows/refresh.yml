# Rebuild the README header images daily so the tagline's GitHub stars and
# PyPI downloads stay current. Commits only when a file changed.
name: refresh

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/build.py]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/build.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: commit if changed
        run: |
          git config user.name "phone-harness-media"
          git config user.email "actions@users.noreply.github.com"
          git add phone-harness
          git diff --cached --quiet || (git commit -m "Refresh stats" && git push)
